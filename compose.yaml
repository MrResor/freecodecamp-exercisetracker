services:
  api:
    build:
      context: .
      dockerfile: Dockerfile_api
    restart: unless-stopped
    ports:
      - "10003:3000"
    depends_on:
      db:
        condition: service_healthy
        restart: true
    volumes:
      - /home/ubuntu/running/logs/freecodecamp-exercisetracker:/program/logs
    environment:
      NODE_ENV: production
    networks:
      - default
      - db_network

  db:
    build:
      context: .
      dockerfile: Dockerfile_db
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGUSER=${USER_LOGIN}
      - PGPASSWORD=${USER_PASSWORD}
    volumes:
      - pg-volume:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${USER_LOGIN} -d exercise_tracker" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    networks:
      - db_network

volumes:
  pg-volume:
networks:
  db_network:
    driver: bridge
    internal: true
  default:
    driver: bridge 
    internal: false
